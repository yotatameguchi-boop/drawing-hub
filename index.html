<title>検図台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E7EBF0; --surface:#F3F6FA; --panel:#FFFFFF; --panel-2:#F7F9FC;
  --ink:#131C28; --ink-2:#4C5868; --ink-3:#8593A4;
  --line:#C9D2DE; --line-2:#E2E8F0;
  --accent:#234B85; --accent-2:#3A6CB0; --accent-soft:#DEE7F5;
  --shu:#BC3B2B; --shu-soft:#F7E2DE;
  --ok:#2C6A4C; --ok-soft:#DCEDE4;
  --warn:#8E6510; --warn-soft:#F6EBD5;
  --grid:rgba(35,75,133,.075);
  --shadow:0 1px 2px rgba(19,28,40,.06),0 8px 24px rgba(19,28,40,.07);
  --sheet:#FBFCFD; --sheet-ink:#1A2430; --sheet-edge:#B9C3D1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1319; --surface:#141A22; --panel:#1A212B; --panel-2:#161D26;
    --ink:#E5EBF3; --ink-2:#9DAABB; --ink-3:#6B7A8D;
    --line:#2A3441; --line-2:#212A35;
    --accent:#7FA8E8; --accent-2:#A2C1F2; --accent-soft:#1D2A3C;
    --shu:#E9705A; --shu-soft:#3A211C;
    --ok:#63B18B; --ok-soft:#172A22;
    --warn:#D8A84C; --warn-soft:#2B2313;
    --grid:rgba(150,180,220,.07);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1319; --surface:#141A22; --panel:#1A212B; --panel-2:#161D26;
  --ink:#E5EBF3; --ink-2:#9DAABB; --ink-3:#6B7A8D;
  --line:#2A3441; --line-2:#212A35;
  --accent:#7FA8E8; --accent-2:#A2C1F2; --accent-soft:#1D2A3C;
  --shu:#E9705A; --shu-soft:#3A211C;
  --ok:#63B18B; --ok-soft:#172A22;
  --warn:#D8A84C; --warn-soft:#2B2313;
  --grid:rgba(150,180,220,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"Roboto Mono","SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);}
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px;padding-right:14px;border-right:1px solid var(--line-2)}
.brand b{font-size:17px;white-space:nowrap;letter-spacing:.14em;font-weight:700}
.brand span{font-size:9.5px;white-space:nowrap;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase}
.proj-pick{display:flex;align-items:center;gap:8px;min-width:0}
.select{
  appearance:none;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
  padding:5px 26px 5px 10px;max-width:340px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;
}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:7px}
.who input{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 9px;width:112px}
.lbl{font-size:10px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.conn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}

.main{display:grid;grid-template-columns:272px minmax(0,1fr) 352px;min-height:0}
.rail,.side{background:var(--panel);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.rail{border-right:1px solid var(--line)}
.side{border-left:1px solid var(--line)}
.stage{background:var(--surface);min-width:0;display:flex;flex-direction:column;min-height:0}

/* ---------- rail ---------- */
.rail-head,.side-head{
  display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line-2);flex:none;
}
.rail-head h2,.side-head h2{margin:0;font-size:11px;letter-spacing:.18em;color:var(--ink-2);font-weight:700;text-transform:uppercase}
.scroll{overflow:auto;min-height:0;flex:1}
.dwg{
  display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;
  width:100%;text-align:left;padding:10px 13px;background:none;border:0;border-bottom:1px solid var(--line-2);cursor:pointer;
}
.dwg:hover{background:var(--panel-2)}
.dwg[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.dwg-no{font-size:11px;color:var(--accent);font-weight:500}
.dwg-title{grid-column:1/3;font-size:13.5px;font-weight:500;line-height:1.35}
.dwg-meta{grid-column:1/4;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3)}
.rev-tag{font-size:10px;letter-spacing:.08em;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--ink-2)}
.count{
  grid-row:1;grid-column:3;font-size:11px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
  display:grid;place-items:center;background:var(--shu-soft);color:var(--shu);font-weight:700;
}
.count.zero{background:transparent;color:var(--ink-3);font-weight:400}

/* ---------- title block ---------- */
.titleblock{
  display:grid;grid-template-columns:2.2fr 1fr 1fr .9fr 1.3fr;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none;
}
.tb{padding:7px 12px;border-right:1px solid var(--line-2);min-width:0}
.tb:last-child{border-right:0}
.tb i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.tb b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vis{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:11px;border:1px solid var(--line);color:var(--ink-2)}
.vis.private{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.vis.open{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);flex:none;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:5px;padding:5px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent-2);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn[aria-pressed="true"],:root:not([data-theme="light"]) .btn[aria-pressed="true"]{color:#0F1319}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F1319}
.btn.primary:hover{opacity:.9;color:#fff}
:root[data-theme="dark"] .btn.primary:hover{color:#0F1319}
.btn.small{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:5px 10px;cursor:pointer;font-size:12px;border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.slider{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2)}
input[type=range]{accent-color:var(--accent);width:104px}

/* ---------- revisions ---------- */
.revbar{display:flex;align-items:center;gap:0;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.rev{
  position:relative;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;
  padding:8px 13px;text-align:left;white-space:nowrap;color:var(--ink-2);
}
.rev b{display:block;font-size:13px;font-weight:700;letter-spacing:.06em}
.rev i{display:block;font-style:normal;font-size:10px;color:var(--ink-3)}
.rev[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rev.cmp{border-bottom-color:var(--shu);color:var(--shu)}

/* ---------- sheet ---------- */
.sheet-wrap{
  flex:1;min-height:0;overflow:auto;padding:26px;display:grid;place-items:start center;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.sheet{
  position:relative;background:var(--sheet);box-shadow:0 2px 3px rgba(19,28,40,.10),0 14px 40px rgba(19,28,40,.16);
  border:1px solid var(--sheet-edge);transform-origin:top center;width:min(100%,1189px);
}
.sheet.invert{filter:invert(1) hue-rotate(180deg)}
.layer{position:absolute;inset:0;width:100%;height:100%}
.layer svg,.layer img{display:block;width:100%;height:100%;object-fit:contain}
.layer.top{transition:opacity .12s linear}
.pinlayer{position:absolute;inset:0;pointer-events:none}
.pin{pointer-events:auto}
.sheet.picking{cursor:crosshair}
.pin{
  position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50% 50% 50% 2px;
  transform:rotate(-45deg);background:var(--sheet);border:1.5px solid var(--shu);color:var(--shu);
  display:grid;place-items:center;cursor:pointer;padding:0;
}
.pin>span{transform:rotate(45deg);font-size:11px;font-weight:700;font-family:"Roboto Mono",monospace}
.pin.done{border-color:var(--ok);color:var(--ok)}
.pin[aria-current="true"]{background:var(--shu);color:var(--sheet);box-shadow:0 0 0 4px var(--shu-soft)}
.pin.done[aria-current="true"]{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.stage3d{position:relative;width:100%;height:100%;min-height:340px;background:var(--sheet);border:1px solid var(--sheet-edge);box-shadow:0 2px 3px rgba(19,28,40,.10),0 14px 40px rgba(19,28,40,.16)}
.stage3d canvas{display:block;width:100%;height:100%;touch-action:none}
.stage3d.picking canvas{cursor:crosshair}
.pin3d{z-index:2}
.hud{position:absolute;left:10px;bottom:9px;font-family:"Roboto Mono",monospace;font-size:10.5px;color:var(--sheet-ink);opacity:.62;pointer-events:none}
.loading3d{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px;background:var(--sheet)}
.empty{padding:40px 24px;text-align:center;color:var(--ink-3);font-size:13px;max-width:34ch;margin:0 auto}
.empty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:6px}

/* ---------- threads ---------- */
.filters{display:flex;gap:5px;padding:8px 12px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;flex:none}
.f{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:2px 9px;font-size:11.5px;cursor:pointer}
.f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .f[aria-pressed="true"]{color:#0F1319}
.thread{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);padding:11px 13px;cursor:pointer;display:block}
.thread:hover{background:var(--panel-2)}
.thread[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.th-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.num{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--shu);font-weight:700}
.num.done{color:var(--ok)}
.chip{font-size:10.5px;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.kind-意匠{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.kind-構造{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip.kind-設備{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.kind-法規{border-color:var(--shu);color:var(--shu);background:var(--shu-soft)}
.th-title{font-size:13px;font-weight:500;line-height:1.4}
.th-sub{font-size:11px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px}
.detail{border-top:1px solid var(--line);background:var(--panel-2);padding:12px 13px;flex:none;max-height:52%;overflow:auto}
.reply{border-left:2px solid var(--line);padding:4px 0 4px 9px;margin-top:8px}
.reply .rmeta{font-size:10.5px;color:var(--ink-3)}
.reply p{margin:2px 0 0}
textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 9px;resize:vertical;min-height:56px}
.row{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.stamp{
  display:grid;place-items:center;width:62px;height:62px;border-radius:50%;border:2px solid var(--shu);color:var(--shu);
  transform:rotate(-11deg);text-align:center;line-height:1.15;flex:none;
}
.stamp b{font-size:13px;font-weight:700;display:block}
.stamp i{font-style:normal;font-size:8.5px;font-family:"Roboto Mono",monospace}

/* ---------- dialog ---------- */
.mask{position:fixed;inset:0;background:rgba(10,16,24,.5);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);width:min(520px,100%);max-height:88dvh;overflow:auto}
.modal h3{margin:0;padding:14px 17px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.modal .body{padding:15px 17px;display:grid;gap:12px}
.modal .foot{padding:12px 17px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:8px}
.field{display:grid;gap:5px}
.field>span{font-size:11px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.field input,.field select{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.opt[data-on="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt strong{display:block;font-size:13px}
.opt small{color:var(--ink-2);font-size:11.5px;line-height:1.5;display:block}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 15px;border-radius:6px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.banner{display:flex;gap:9px;align-items:center;padding:7px 14px;background:var(--warn-soft);color:var(--warn);font-size:12px;border-bottom:1px solid var(--line)}
.skel{height:11px;border-radius:3px;background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

@media (max-width:1080px){
  .app{height:auto;min-height:100dvh}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:8px}
  .brand{padding-right:10px}
  .main{display:flex;flex-direction:column;min-height:0}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .side{border-left:0;border-top:1px solid var(--line)}
  .rail .scroll,.side .scroll{overflow:visible;flex:none}
  .stage{min-height:64dvh}
  .detail{max-height:none}
  .sheet-wrap{padding:12px}
  .titleblock{grid-template-columns:1fr 1fr}
  .tb{border-bottom:1px solid var(--line-2)}
}
</style>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>検図台</b><span>drawing review</span></div>
    <div class="proj-pick">
      <select class="select" id="projSel" aria-label="プロジェクト"></select>
      <button class="btn small" id="btnNewProj">＋ プロジェクト</button>
      <button class="btn small" id="btnProjSet">公開範囲</button>
    </div>
    <div class="spacer"></div>
    <div class="who"><span class="lbl">表示名</span><input id="meName" placeholder="担当者名" maxlength="14"></div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connTxt">接続中…</span></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="main">
    <aside class="rail">
      <div class="rail-head">
        <h2>図面リスト</h2><span class="spacer"></span>
        <button class="btn small" id="btnNewDwg">＋ 図面</button>
      </div>
      <div class="scroll" id="dwgList"></div>
    </aside>

    <section class="stage">
      <div class="titleblock" id="tblock"></div>

      <div class="toolbar" id="toolbar">
        <button class="btn" id="btnPin" aria-pressed="false">指摘を打つ</button>
        <button class="btn" id="btnRev">＋ 版を追加</button>
        <span style="width:1px;height:20px;background:var(--line)"></span>
        <div class="seg" role="group" aria-label="比較表示">
          <button data-cmp="none" aria-pressed="true">単票</button>
          <button data-cmp="overlay" aria-pressed="false">重ね</button>
          <button data-cmp="wipe" aria-pressed="false">ワイプ</button>
          <button data-cmp="side" aria-pressed="false">並べて</button>
        </div>
        <label class="slider" id="cmpCtl" hidden>
          <span id="cmpLabel">透過</span>
          <input type="range" id="cmpRange" min="0" max="100" value="50">
          <b class="mono" id="cmpVal" style="font-weight:500;width:34px">50%</b>
        </label>
        <span class="spacer"></span>
        <div class="seg" role="group" aria-label="表示倍率">
          <button id="zOut" title="縮小">−</button>
          <button id="zFit" class="mono" style="min-width:56px">100%</button>
          <button id="zIn" title="拡大">＋</button>
        </div>
        <button class="btn" id="btnInvert" aria-pressed="false" title="黒背景・白線で表示">反転</button>
        <button class="btn" id="btnCsv">検図リスト</button>
        <button class="btn primary" id="btnApprove">検図結果を記録</button>
      </div>

      <div class="revbar" id="revbar"></div>
      <div class="sheet-wrap" id="sheetWrap"></div>
    </section>

    <aside class="side">
      <div class="side-head">
        <h2>指摘事項</h2><span class="spacer"></span>
        <span class="mono" id="markStat" style="font-size:11px;color:var(--ink-3)"></span>
      </div>
      <div class="filters" id="filters">
        <button class="f" data-f="status:open" aria-pressed="true">未対応</button>
        <button class="f" data-f="status:doing" aria-pressed="true">対応中</button>
        <button class="f" data-f="status:done" aria-pressed="false">完了</button>
        <span style="width:1px;background:var(--line-2)"></span>
        <button class="f" data-f="rev:cur" aria-pressed="false">この版のみ</button>
      </div>
      <div class="scroll" id="threads"></div>
      <div class="detail" id="detail" hidden></div>
    </aside>
  </div>
</div>
<div id="modalHost"></div>
<div id="toastHost"></div>
<script>
"use strict";
/* ---------------- utils ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=(p)=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowISO=()=>new Date().toISOString();
const fdate=(iso)=>{const d=new Date(iso);return isNaN(d)?"":`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;};
const REVLET=(i)=>String.fromCharCode(65+Math.min(i,25));
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  $("#toastHost").appendChild(t);setTimeout(()=>t.remove(),2600);
}
function dialog({title,body,ok="登録",onOk,wide}){
  const host=$("#modalHost");
  host.innerHTML=`<div class="mask"><div class="modal" role="dialog" aria-modal="true"${wide?' style="width:min(660px,100%)"':""}>
    <h3>${esc(title)}</h3><div class="body">${body}</div>
    <div class="foot"><button class="btn" data-x>キャンセル</button><button class="btn primary" data-ok>${esc(ok)}</button></div>
  </div></div>`;
  const close=()=>{host.innerHTML="";document.removeEventListener("keydown",key);};
  const key=(e)=>{if(e.key==="Escape")close();};
  document.addEventListener("keydown",key);
  $("[data-x]",host).onclick=close;
  $(".mask",host).onclick=(e)=>{if(e.target===$(".mask",host))close();};
  $("[data-ok]",host).onclick=async()=>{const r=await onOk($(".modal",host));if(r!==false)close();};
  const f=$("input,select,textarea",host); if(f)f.focus();
  return {close,root:$(".modal",host)};
}

/* ---------------- sample drawings (procedural) ---------------- */
function dimH(x1,x2,y,label,ink){
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${ink}" stroke-width="1"/>
  <line x1="${x1-5}" y1="${y+5}" x2="${x1+5}" y2="${y-5}" stroke="${ink}" stroke-width="1.4"/>
  <line x1="${x2-5}" y1="${y+5}" x2="${x2+5}" y2="${y-5}" stroke="${ink}" stroke-width="1.4"/>
  <text x="${(x1+x2)/2}" y="${y-7}" fill="${ink}" font-family="Roboto Mono, monospace" font-size="13" text-anchor="middle">${label}</text>`;
}
function dimV(y1,y2,x,label,ink){
  return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${ink}" stroke-width="1"/>
  <line x1="${x-5}" y1="${y1+5}" x2="${x+5}" y2="${y1-5}" stroke="${ink}" stroke-width="1.4"/>
  <line x1="${x-5}" y1="${y2+5}" x2="${x+5}" y2="${y2-5}" stroke="${ink}" stroke-width="1.4"/>
  <text x="${x-8}" y="${(y1+y2)/2}" fill="${ink}" font-family="Roboto Mono, monospace" font-size="13" text-anchor="middle" transform="rotate(-90 ${x-8} ${(y1+y2)/2})">${label}</text>`;
}
function room(x1,y1,x2,y2,name,area,ink){
  const cx=(x1+x2)/2, cy=(y1+y2)/2;
  return `<text x="${cx}" y="${cy}" fill="${ink}" font-size="17" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif">${name}</text>
  <text x="${cx}" y="${cy+18}" fill="${ink}" font-size="11" text-anchor="middle" font-family="Roboto Mono, monospace" opacity="0.75">${area}</text>`;
}
function genPlan(variant,ink){
  const XS=[200,395,590,785,980], YS=[190,415,640];
  const P=variant==="b"?845:785;
  let s=`<rect x="34" y="34" width="1121" height="773" fill="none" stroke="${ink}" stroke-width="2"/>`;
  XS.forEach((x,i)=>{
    s+=`<line x1="${x}" y1="150" x2="${x}" y2="700" stroke="${ink}" stroke-width="0.8" stroke-dasharray="20 5 3 5" opacity="0.85"/>
    <circle cx="${x}" cy="134" r="15" fill="none" stroke="${ink}" stroke-width="1"/>
    <text x="${x}" y="139" fill="${ink}" font-size="13" text-anchor="middle" font-family="Roboto Mono, monospace">X${i+1}</text>`;
  });
  YS.forEach((y,i)=>{
    s+=`<line x1="150" y1="${y}" x2="1030" y2="${y}" stroke="${ink}" stroke-width="0.8" stroke-dasharray="20 5 3 5" opacity="0.85"/>
    <circle cx="134" cy="${y}" r="15" fill="none" stroke="${ink}" stroke-width="1"/>
    <text x="134" y="${y+5}" fill="${ink}" font-size="13" text-anchor="middle" font-family="Roboto Mono, monospace">Y${i+1}</text>`;
  });
  s+=`<rect x="200" y="190" width="780" height="450" fill="none" stroke="${ink}" stroke-width="5.5"/>`;
  const w=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="3"/>`;
  s+=w(590,190,590,415)+w(P,190,P,415)+w(200,415,980,415)+w(200,505,980,505)
    +w(395,505,395,640)+w(590,505,590,640)+w(785,505,785,640);
  s+=`<line x1="605" y1="415" x2="675" y2="415" stroke="${ink==="none"?ink:"#FBFCFD"}" stroke-width="5"/>
  <path d="M605 415 A70 70 0 0 0 675 345" fill="none" stroke="${ink}" stroke-width="1" opacity="0.7"/>
  <line x1="605" y1="415" x2="605" y2="345" stroke="${ink}" stroke-width="2.4"/>`;
  s+=room(200,190,590,415,"事務室","116.4 m2",ink);
  s+=room(590,190,P,415,"会議室A",variant==="b"?"38.6 m2":"33.8 m2",ink);
  s+=room(P,190,980,415,variant==="b"?"打合せコーナー":"倉庫",variant==="b"?"20.2 m2":"25.0 m2",ink);
  s+=`<text x="590" y="465" fill="${ink}" font-size="15" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif">廊下（有効 1,200）</text>`;
  s+=room(200,505,395,640,"給湯室","12.6 m2",ink);
  s+=room(395,505,590,640,"便所","18.9 m2",ink);
  s+=room(590,505,785,640,"階段","",ink);
  s+=room(785,505,980,640,"EV ホール","",ink);
  s+=dimH(200,395,110,"7,800",ink)+dimH(395,590,110,"7,800",ink)+dimH(590,785,110,"7,800",ink)+dimH(785,980,110,"7,800",ink)+dimH(200,980,78,"31,200",ink);
  s+=dimV(190,415,108,"9,000",ink)+dimV(415,640,108,"9,000",ink)+dimV(190,640,76,"18,000",ink);
  s+=`<g><circle cx="1085" cy="150" r="26" fill="none" stroke="${ink}" stroke-width="1"/>
  <path d="M1085 128 L1092 158 L1085 150 L1078 158 Z" fill="${ink}"/>
  <text x="1085" y="188" fill="${ink}" font-size="13" text-anchor="middle" font-family="Roboto Mono, monospace">N</text></g>`;
  if(variant==="b"){
    s+=`<rect x="${P-215}" y="176" width="250" height="252" fill="none" stroke="${ink}" stroke-width="1.4" stroke-dasharray="7 5"/>
    <path d="M${P+52} 168 L${P+72} 200 L${P+32} 200 Z" fill="none" stroke="${ink}" stroke-width="1.4"/>
    <text x="${P+52}" y="196" fill="${ink}" font-size="13" text-anchor="middle" font-family="Roboto Mono, monospace">B</text>`;
  }
  s+=`<text x="56" y="790" fill="${ink}" font-size="13" font-family="Roboto Mono, monospace">S = 1:200   UNIT: mm</text>`;
  return s;
}
function genElev(ink){
  let s=`<rect x="34" y="34" width="1121" height="773" fill="none" stroke="${ink}" stroke-width="2"/>`;
  s+=`<line x1="140" y1="660" x2="1050" y2="660" stroke="${ink}" stroke-width="5.5"/>
  <text x="150" y="682" fill="${ink}" font-size="13" font-family="Roboto Mono, monospace">GL ± 0</text>`;
  s+=`<rect x="220" y="250" width="740" height="410" fill="none" stroke="${ink}" stroke-width="3"/>
  <rect x="208" y="232" width="764" height="20" fill="none" stroke="${ink}" stroke-width="3"/>`;
  [523,386].forEach(y=>{s+=`<line x1="220" y1="${y}" x2="960" y2="${y}" stroke="${ink}" stroke-width="1.2" opacity="0.8"/>`;});
  for(let r=0;r<3;r++){
    const y=560-r*137;
    for(let c=0;c<6;c++){
      const x=262+c*116;
      s+=`<rect x="${x}" y="${y}" width="82" height="66" fill="none" stroke="${ink}" stroke-width="1.6"/>
      <line x1="${x}" y1="${y}" x2="${x+82}" y2="${y+66}" stroke="${ink}" stroke-width="0.5" opacity="0.45"/>`;
    }
  }
  s+=`<rect x="560" y="576" width="88" height="84" fill="none" stroke="${ink}" stroke-width="2.2"/>
  <line x1="604" y1="576" x2="604" y2="660" stroke="${ink}" stroke-width="1"/>
  <text x="604" y="700" fill="${ink}" font-size="12" text-anchor="middle" font-family="Zen Kaku Gothic New, sans-serif">主出入口</text>`;
  s+=dimV(232,660,1010,"12,400",ink)+dimV(386,523,1075,"3,800",ink)+dimV(523,660,1075,"3,800",ink);
  [["3FL",386],["2FL",523],["1FL",660]].forEach(([t,y])=>{
    s+=`<line x1="150" y1="${y}" x2="220" y2="${y}" stroke="${ink}" stroke-width="0.8" stroke-dasharray="14 4 2 4"/>
    <text x="152" y="${y-7}" fill="${ink}" font-size="12" font-family="Roboto Mono, monospace">${t}</text>`;
  });
  s+=`<line x1="700" y1="300" x2="880" y2="196" stroke="${ink}" stroke-width="0.8"/>
  <circle cx="700" cy="300" r="3" fill="${ink}"/>
  <text x="884" y="200" fill="${ink}" font-size="13" font-family="Zen Kaku Gothic New, sans-serif">押出成形セメント板 t=60 / 塗装仕上</text>`;
  s+=`<text x="56" y="790" fill="${ink}" font-size="13" font-family="Roboto Mono, monospace">S = 1:200   UNIT: mm</text>`;
  return s;
}
function genSVG(kind,ink){
  const inner=kind==="elev"?genElev(ink):genPlan(kind==="plan-b"?"b":"a",ink);
  return `<svg viewBox="0 0 1189 841" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="サンプル図面">${inner}</svg>`;
}
</script>
<script>
/* ---------------- state ---------------- */
const S={db:null,assets:null,dl:null,editor:false,ready:false,
  projects:[],pid:null,drawings:[],did:null,revs:[],marks:[],
  view:"2d",revId:null,cmpId:null,mode:"none",ratio:50,zoom:1,invert:false,pinMode:false,selMark:null,
  filt:{open:1,doing:1,done:0,curRev:0},me:""};
const bucket={projects:[],vault:[]};
const subs={};
const KINDS=["意匠","構造","設備","法規","その他"];
const STATUS={open:"未対応",doing:"対応中",done:"完了"};
const rootOf=(p)=>p&&p.visibility==="private"?"vault":"projects";
const curProj=()=>S.projects.find(p=>p.id===S.pid)||null;
const curDwg=()=>S.drawings.find(d=>d.id===S.did)||null;
const revsIn=(v)=>S.revs.filter(r=>(r.view||"2d")===(v||S.view));
const has3D=()=>S.revs.some(r=>r.view==="3d");
const curRev=()=>{const l=revsIn();return l.find(r=>r.id===S.revId)||l[l.length-1]||null;};
const cmpRev=()=>S.revs.find(r=>r.id===S.cmpId)||null;
const base=()=>{const p=curProj();return p?`${rootOf(p)}/${p.id}`:null;};
const dwgPath=()=>base()&&S.did?`${base()}/drawings/${S.did}`:null;
const need=()=>{if(!S.db){toast("共有バックエンドに接続していません");return false;}return true;};

/* ---------------- boot ---------------- */
S.me=localStorage.getItem("kz.me")||"";
$("#meName").value=S.me;
$("#meName").oninput=(e)=>{S.me=e.target.value.trim();localStorage.setItem("kz.me",S.me);};
setConn("接続中…","");
renderAll();

(async()=>{
  const use=(n)=>(window.claude&&claude.use)?Promise.resolve(claude.use(n)).catch(()=>null):Promise.resolve(null);
  const [db,assets,dl]=await Promise.all([use("db"),use("assets"),use("downloads")]);
  S.db=db;S.assets=assets;S.dl=dl;S.editor=!!assets;S.ready=true;
  $("#btnCsv").hidden=!dl;
  if(!db){
    setConn("未接続（閲覧のみ）","off");
    banner("共有バックエンドに接続できません。公開されたこのページを claude.ai で開くと、図面と指摘がチームで共有されます。");
    renderAll();return;
  }
  setConn(S.editor?"接続済み・編集権限あり":"接続済み・閲覧と指摘","on");
  subProjects();
})();

function setConn(t,k){$("#connTxt").textContent=t;$("#connDot").className="dot"+(k?" "+k:"");}
function banner(t){const b=$("#banner");b.hidden=!t;b.textContent=t||"";}

/* ---------------- subscriptions ---------------- */
function subProjects(){
  ["projects","vault"].forEach(rt=>{
    if(subs[rt])subs[rt]();
    subs[rt]=S.db.collection(rt).onSnapshot(
      snap=>{bucket[rt]=snap.docs.map(d=>({...d.data(),id:d.id,_root:rt}));mergeProjects();},
      ()=>{bucket[rt]=[];mergeProjects();}
    );
  });
}
function mergeProjects(){
  S.projects=[...bucket.projects,...bucket.vault].sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  if(!S.pid||!curProj())selectProject(S.projects[0]?S.projects[0].id:null,true);
  else renderProjects();
}
function selectProject(pid,silent){
  S.pid=pid;S.did=null;S.drawings=[];S.revs=[];S.marks=[];S.selMark=null;
  ["dwg","rev","mark"].forEach(k=>{if(subs[k]){subs[k]();delete subs[k];}});
  if(S.db&&pid){
    subs.dwg=S.db.collection(`${base()}/drawings`).onSnapshot(snap=>{
      S.drawings=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>String(a.no).localeCompare(String(b.no)));
      if(!S.did||!curDwg())selectDrawing(S.drawings[0]?S.drawings[0].id:null);
      else renderAll();
    },()=>{});
  }
  renderAll();
}
function selectDrawing(did){
  S.did=did;S.revs=[];S.marks=[];S.selMark=null;S.revId=null;S.cmpId=null;
  ["rev","mark"].forEach(k=>{if(subs[k]){subs[k]();delete subs[k];}});
  if(S.db&&did){
    subs.rev=S.db.collection(`${dwgPath()}/revs`).onSnapshot(snap=>{
      S.revs=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
      if(!revsIn().length&&S.revs.length)S.view=(S.revs[0].view||"2d");
      const rl=revsIn();
      if(!S.revId||!rl.some(r=>r.id===S.revId))S.revId=rl.length?rl[rl.length-1].id:null;
      renderStage();
    },()=>{});
    subs.mark=S.db.collection(`${dwgPath()}/marks`).onSnapshot(snap=>{
      S.marks=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.no||0)-(b.no||0));
      renderStage();renderThreads();renderDwgList();
    },()=>{});
  }
  renderAll();
}

/* ---------------- render ---------------- */
function renderAll(){renderProjects();renderDwgList();renderStage();renderThreads();}

function renderProjects(){
  const sel=$("#projSel");
  sel.innerHTML=S.projects.length
    ? S.projects.map(p=>`<option value="${esc(p.id)}"${p.id===S.pid?" selected":""}>${p.visibility==="private"?"非公開 / ":""}${esc(p.name)}</option>`).join("")
    : `<option>プロジェクトがありません</option>`;
  sel.disabled=!S.projects.length;
}

function renderDwgList(){
  const host=$("#dwgList");
  if(!S.db&&!S.ready){host.innerHTML=`<div style="padding:14px;display:grid;gap:9px">${'<div class="skel"></div>'.repeat(5)}</div>`;return;}
  if(!S.projects.length){
    host.innerHTML=`<div class="empty"><b>まだプロジェクトがありません</b>「＋ プロジェクト」から工事名称を登録すると、図面と検図記録をここに集約できます。</div>`;return;
  }
  if(!S.drawings.length){
    host.innerHTML=`<div class="empty"><b>図面が登録されていません</b>「＋ 図面」で図面番号と図面名称を登録し、紙の原図を撮影して版として取り込みます。</div>`;return;
  }
  host.innerHTML=S.drawings.map(d=>{
    const open=d.id===S.did?S.marks.filter(m=>m.status!=="done").length:(d.openCount||0);
    const rv=d.id===S.did?(S.revs.length?S.revs[S.revs.length-1].rev:"—"):(d.lastRev||"—");
    const rl=d.review&&d.review.result;
    return `<button class="dwg" data-did="${esc(d.id)}" aria-current="${d.id===S.did}">
      <span class="dwg-no mono">${esc(d.no)}</span><span></span>
      <span class="count ${open?"":"zero"}">${open}</span>
      <span class="dwg-title">${esc(d.title)}</span>
      <span class="dwg-meta"><span class="rev-tag mono">Rev.${esc(rv)}</span><span>${esc(d.discipline||"")}</span>${d.kind&&d.kind!=="図面"?`<span class="chip">${esc(d.kind)}</span>`:""}
      ${rl?`<span style="color:var(--${rl==="要修正"?"shu":"ok"})">${esc(rl)}</span>`:`<span>検図前</span>`}</span>
    </button>`;
  }).join("");
  $$(".dwg",host).forEach(b=>b.onclick=()=>selectDrawing(b.dataset.did));
}

function renderTitleBlock(){
  const p=curProj(),d=curDwg(),r=curRev();
  const vis=p?(p.visibility==="private"
    ? `<span class="vis private">非公開</span>`
    : `<span class="vis open">オープン</span>`):"";
  $("#tblock").innerHTML=`
    <div class="tb"><i>工事名称</i><b>${p?esc(p.name):"—"} ${vis}${p&&p.sample?' <span class="chip">サンプル</span>':""}</b></div>
    <div class="tb"><i>図面番号</i><b class="mono">${d?esc(d.no):"—"}</b></div>
    <div class="tb"><i>図面名称</i><b>${d?esc(d.title):"—"}</b></div>
    <div class="tb"><i>縮尺</i><b class="mono">${d?esc(d.scale||"—"):"—"}</b></div>
    <div class="tb"><i>版 / 検図</i><b class="mono">${r?"Rev."+esc(r.rev):"—"} <span style="color:var(--ink-3)">/</span> ${
      d&&d.review?`<span style="color:var(--${d.review.result==="要修正"?"shu":"ok"})">${esc(d.review.result)}</span>`:"未実施"}</b></div>`;
}

function layerHTML(rev,ink){
  if(!rev)return "";
  if(rev.src==="gen")return genSVG(rev.gen,ink);
  return `<img src="/_blob/${esc(rev.asset)}" alt="${esc(rev.rev)}版の図面">`;
}
function sheetAspect(rev){
  if(rev&&rev.src==="asset"&&rev.w&&rev.h)return `${rev.w} / ${rev.h}`;
  return "1189 / 841";
}
function sheetStyle(rev){
  return `aspect-ratio:${sheetAspect(rev)};width:min(${Math.round(1189*S.zoom)}px, ${Math.round(100*S.zoom)}%)`;
}
function pinsHTML(){
  const r=curRev();
  return S.marks.filter(m=>!S.filt.curRev||!r||m.rev===r.rev).map(m=>
    `<button class="pin ${m.status==="done"?"done":""}" data-mid="${esc(m.id)}" aria-current="${m.id===S.selMark}"
      style="left:${(m.x*100).toFixed(2)}%;top:${(m.y*100).toFixed(2)}%" title="${esc(m.title)}"><span>${m.no}</span></button>`
  ).join("");
}
function renderStage(){
  renderTitleBlock();renderRevbar();
  const w=$("#sheetWrap"),r=curRev(),c=cmpRev();
  const noRev=!S.did||!r;
  $("#btnPin").disabled=noRev;$("#btnRev").disabled=!S.did;$("#btnApprove").disabled=!S.did;
  if(!S.did){
    w.innerHTML=`<div class="empty"><b>図面を選んでください</b>左の図面リストから選ぶと、版の履歴と指摘がここに表示されます。</div>`;return;
  }
  if(!r){
    w.innerHTML=`<div class="empty"><b>まだ版が登録されていません</b>紙の原図を真上から撮影するか、スキャンした画像を「＋ 版を追加」から取り込みます。台形の歪みはその場で補正できます。</div>`;return;
  }
  const inv=S.invert?" invert":"";
  const pick=S.pinMode?" picking":"";
  if(S.mode==="side"&&c){
    w.innerHTML=`<div style="display:flex;gap:14px;width:100%;align-items:flex-start;justify-content:center">
      <div style="flex:1;min-width:0"><div class="lbl" style="margin-bottom:5px">Rev.${esc(c.rev)}（比較）</div>
        <div class="sheet${inv}" style="aspect-ratio:${sheetAspect(c)};width:100%"><div class="layer">${layerHTML(c,"var(--sheet-ink)")}</div></div></div>
      <div style="flex:1;min-width:0"><div class="lbl" style="margin-bottom:5px">Rev.${esc(r.rev)}（現在）</div>
        <div class="sheet${inv}${pick}" id="sheet" style="aspect-ratio:${sheetAspect(r)};width:100%">
          <div class="layer">${layerHTML(r,"var(--sheet-ink)")}</div><div class="pinlayer">${pinsHTML()}</div></div></div>
    </div>`;
  }else{
    const two=(S.mode==="overlay"||S.mode==="wipe")&&c;
    const topStyle=S.mode==="overlay"?`opacity:${S.ratio/100}`
      :S.mode==="wipe"?`clip-path:inset(0 ${100-S.ratio}% 0 0)`:"";
    w.innerHTML=`<div class="sheet${inv}${pick}" id="sheet" style="${sheetStyle(r)}">
      ${two?`<div class="layer">${layerHTML(c,"var(--shu)")}</div>`:""}
      <div class="layer top" style="${topStyle}">${layerHTML(r,two?"var(--accent)":"var(--sheet-ink)")}</div>
      ${two&&S.mode==="wipe"?`<div style="position:absolute;top:0;bottom:0;left:${S.ratio}%;width:1px;background:var(--accent);box-shadow:0 0 0 1px rgba(255,255,255,.6)"></div>`:""}
      <div class="pinlayer">${pinsHTML()}</div></div>`;
  }
  const sh=$("#sheet");
  if(sh){
    sh.onclick=(e)=>{
      if(!S.pinMode)return;
      if(e.target.closest(".pin"))return;
      const b=sh.getBoundingClientRect();
      newMark((e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height);
    };
    $$(".pin",sh).forEach(p=>p.onclick=(e)=>{e.stopPropagation();S.selMark=p.dataset.mid;renderStage();renderThreads();});
  }
  $("#zFit").textContent=Math.round(S.zoom*100)+"%";
}
function renderRevbar(){
  const bar=$("#revbar");
  if(!S.did){bar.innerHTML="";return;}
  bar.innerHTML=revsIn().map(r=>{
    const cur=r.id===S.revId,cmp=r.id===S.cmpId;
    return `<button class="rev${cmp?" cmp":""}" data-rid="${esc(r.id)}" aria-current="${cur}">
      <b>Rev.${esc(r.rev)}</b><i>${esc(fdate(r.at))} ${esc(r.by||"")}</i></button>`;
  }).join("")||`<span class="mono" style="padding:9px 0;color:var(--ink-3);font-size:12px">版なし</span>`;
  $$(".rev",bar).forEach(b=>{

  </div>

<script>
/* ---------------- 画像処理：台形補正・白飛ばし ---------------- */
function solveH(dst,src){
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const [x,y]=dst[i],[u,v]=src[i];
    A.push([x,y,1,0,0,0,-x*u,-y*u]);b.push(u);
    A.push([0,0,0,x,y,1,-x*v,-y*v]);b.push(v);
  }
  for(let i=0;i<8;i++){
    let p=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
    [A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];
    const d=A[i][i]||1e-9;
    for(let c=i;c<8;c++)A[i][c]/=d; b[i]/=d;
    for(let r=0;r<8;r++){if(r===i)continue;const f=A[r][i];if(!f)continue;
      for(let c=i;c<8;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}
  }
  return b.concat([1]);
}
function warp(img,quad,maxSide){
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let W=Math.round(Math.max(d(quad[0],quad[1]),d(quad[3],quad[2])));
  let H=Math.round(Math.max(d(quad[0],quad[3]),d(quad[1],quad[2])));
  const k=Math.min(1,maxSide/Math.max(W,H));W=Math.max(8,Math.round(W*k));H=Math.max(8,Math.round(H*k));
  const sc=document.createElement("canvas");sc.width=img.width;sc.height=img.height;
  sc.getContext("2d").drawImage(img,0,0);
  const sd=sc.getContext("2d").getImageData(0,0,img.width,img.height).data;
  const out=document.createElement("canvas");out.width=W;out.height=H;
  const oi=out.getContext("2d").createImageData(W,H),od=oi.data;
  const h=solveH([[0,0],[W,0],[W,H],[0,H]],quad),iw=img.width,ih=img.height;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const w=h[6]*x+h[7]*y+1;
    const u=(h[0]*x+h[1]*y+h[2])/w, v=(h[3]*x+h[4]*y+h[5])/w;
    const o=(y*W+x)*4;
    if(u<0||v<0||u>=iw-1||v>=ih-1){od[o]=od[o+1]=od[o+2]=255;od[o+3]=255;continue;}
    const x0=u|0,y0=v|0,fx=u-x0,fy=v-y0;
    for(let c=0;c<3;c++){
      const p00=sd[(y0*iw+x0)*4+c],p10=sd[(y0*iw+x0+1)*4+c],p01=sd[((y0+1)*iw+x0)*4+c],p11=sd[((y0+1)*iw+x0+1)*4+c];
      od[o+c]=(p00*(1-fx)+p10*fx)*(1-fy)+(p01*(1-fx)+p11*fx)*fy;
    }
    od[o+3]=255;
  }
  out.getContext("2d").putImageData(oi,0,0);
  return out;
}
function finish(cv,mode){
  if(mode==="raw")return cv;
  const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  const im=ctx.getImageData(0,0,W,H),d=im.data;
  const g=new Float64Array(W*H);
  for(let i=0,p=0;i<d.length;i+=4,p++)g[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  const ii=new Float64Array((W+1)*(H+1));
  for(let y=0;y<H;y++){let row=0;for(let x=0;x<W;x++){row+=g[y*W+x];ii[(y+1)*(W+1)+x+1]=ii[y*(W+1)+x+1]+row;}}
  const r=Math.max(8,Math.round(Math.min(W,H)/26));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const x0=Math.max(0,x-r),y0=Math.max(0,y-r),x1=Math.min(W,x+r+1),y1=Math.min(H,y+r+1);
    const s=ii[y1*(W+1)+x1]-ii[y0*(W+1)+x1]-ii[y1*(W+1)+x0]+ii[y0*(W+1)+x0];
    const mean=s/((x1-x0)*(y1-y0))||1;
    const ratio=g[y*W+x]/mean;
    let v=mode==="line"?(ratio<0.87?0:255):Math.max(0,Math.min(255,(ratio-0.12)/0.88*255));
    const o=(y*W+x)*4;d[o]=d[o+1]=d[o+2]=v;
  }
  ctx.putImageData(im,0,0);
  return cv;
}
const toBlob=(cv,mode)=>new Promise(res=>cv.toBlob(res,mode==="line"?"image/png":"image/jpeg",0.92));

/* ---------------- PDF ---------------- */
let pdfLib=null;
function loadPdfJs(){
  if(pdfLib)return Promise.resolve(pdfLib);
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js";
    s.onload=()=>{pdfLib=window.pdfjsLib;
      if(pdfLib)pdfLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
      pdfLib?res(pdfLib):rej(new Error("pdf"));};
    s.onerror=()=>rej(new Error("pdf"));
    document.head.appendChild(s);
  });
}
async function pdfPageToCanvas(doc,n,maxSide){
  const page=await doc.getPage(n);
  const v1=page.getViewport({scale:1});
  const scale=Math.min(4,maxSide/Math.max(v1.width,v1.height));
  const vp=page.getViewport({scale});
  const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
  const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return cv;
}

/* ---------------- 取り込み（版の追加） ---------------- */
function nextRevLetter(){
  const used=revsIn("2d").map(r=>r.rev);
  for(let i=0;i<26;i++){const l=REVLET(i);if(!used.includes(l))return l;}
  return String(S.revs.length+1);
}
function openCapture(){
  if(!need())return;
  if(!S.assets){toast("図面の取り込みには編集権限が必要です（このアーティファクトを「編集可」で共有してもらってください）");return;}
  const st={img:null,quad:null,mode:"shadow",warp:true,canvas:null,pdfDoc:null,page:1,pdfBlob:null};
  const dlg=dialog({title:"版を追加 — 原図の取り込み",wide:true,ok:"この内容で登録",onOk:()=>register(dlg,st)});
  step1(dlg,st);
}
function step1(dlg,st){
  $(".body",dlg.root).innerHTML=`
    <div class="note">紙の図面は<b>真上から撮影</b>して台形補正するのが最短です。A3以下はスキャナ（300dpi・グレースケール）が最もきれいに残ります。</div>
    <div style="display:grid;gap:9px">
      <label class="opt"><div><strong>カメラで撮影する</strong><small>スマートフォンで開いている場合、その場でカメラが起動します。図面の四隅が画面に入るように、影が落ちない向きで。</small>
        <input type="file" accept="image/*" capture="environment" id="capCam" style="margin-top:7px"></div></label>
      <label class="opt"><div><strong>画像ファイル（JPG / PNG）</strong><small>スキャナで取り込んだ画像、既に撮影済みの写真。</small>
        <input type="file" accept="image/*" id="capFile" style="margin-top:7px"></div></label>
      <label class="opt"><div><strong>PDF</strong><small>CADからの出力やスキャンPDF。ページを選んで画像として取り込みます。</small>
        <input type="file" accept="application/pdf" id="capPdf" style="margin-top:7px"></div></label>
    </div>
    <div class="note">撮影のコツ： ①真上から ②蛍光灯の映り込みを避ける ③図面枠の四隅を画面内に ④なるべく明るい場所で</div>`;
  $("[data-ok]",dlg.root).disabled=true;
  const onImg=(e)=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const img=new Image();img.onload=()=>{st.img=img;st.pdfBlob=null;step2(dlg,st);};
    img.onerror=()=>toast("画像を読み込めませんでした");
    img.src=URL.createObjectURL(f);
  };
  $("#capCam",dlg.root).onchange=onImg;
  $("#capFile",dlg.root).onchange=onImg;
  $("#capGlb",dlg.root).onchange=async(e)=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    $(".body",dlg.root).innerHTML=`<div class="note">3Dモデルを登録しています… 大きなモデルは少し時間がかかります。</div>`;
    try{
      const buf=await f.arrayBuffer();
      if(buf.byteLength>14.5*1024*1024)throw new Error("size");
      const wrapped=JSON.stringify({format:/\.gltf$/i.test(f.name)?"gltf":"glb",name:f.name,b64:abToB64(buf)});
      const up=await S.assets.upload(new Blob([wrapped],{type:"application/json"}),{type:"application/json"});
      const rev=next3DLetter();
      await S.db.collection(`${dwgPath()}/revs`).add({
        rev,view:"3d",src:"model",asset:up.id,format:/\.gltf$/i.test(f.name)?"gltf":"glb",
        note:f.name,by:S.me||"名無し",at:nowISO()});
      await S.db.doc(dwgPath()).update({has3d:true});
      S.view="3d";S.revId=null;
      toast(`3Dモデル Rev.${rev} を登録しました`);
      dlg.close();renderStage();
    }catch(err){
      $(".body",dlg.root).innerHTML=`<div class="note" style="color:var(--shu)">${
        err&&err.message==="size"?"ファイルが大きすぎます（約14MBまで）。不要なオブジェクトを削るか、テクスチャを縮小して書き出してください。"
        :"3Dモデルを登録できませんでした。GLB形式での書き出しをお試しください。"}</div>`;
    }
  };
  $("#capPdf",dlg.root).onchange=async(e)=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    $(".body",dlg.root).innerHTML=`<div class="note">PDFを読み込んでいます…</div>`;
    try{
      const lib=await loadPdfJs();
      const buf=await f.arrayBuffer();
      st.pdfBlob=f;
      st.pdfDoc=await lib.getDocument({data:buf,isEvalSupported:false}).promise;
      st.page=1;stepPdf(dlg,st);
    }catch(err){
      $(".body",dlg.root).innerHTML=`<div class="note" style="color:var(--shu)">PDFを読み込めませんでした。CADから画像（PNG/JPG）で書き出して取り込んでください。</div>`;
    }
  };
}
async function stepPdf(dlg,st){
  const n=st.pdfDoc.numPages;
  $(".body",dlg.root).innerHTML=`
    <div class="row" style="margin:0">
      <span class="lbl">ページ</span>
      <select class="select" id="pg">${Array.from({length:n},(_,i)=>`<option value="${i+1}"${i+1===st.page?" selected":""}>${i+1} / ${n}</option>`).join("")}</select>
      <span class="spacer" style="flex:1"></span>
      <span class="lbl">仕上げ</span>
      <select class="select" id="fin"><option value="raw">そのまま</option><option value="shadow">白飛ばし</option><option value="line">線画（2値）</option></select>
    </div>
    <div id="pv" style="display:grid;place-items:center;background:var(--sheet);border:1px solid var(--line);min-height:220px;padding:8px"></div>
    <div class="note">元のPDFも一緒に保管されます（版の履歴からいつでも取り出せます）。</div>`;
  $("[data-ok]",dlg.root).disabled=true;
  const draw=async()=>{
    $("#pv",dlg.root).innerHTML=`<span class="note">描画中…</span>`;
    try{
      const cv=await pdfPageToCanvas(st.pdfDoc,st.page,2000);
      st.canvas=finish(cv,$("#fin",dlg.root).value);
      st.canvas.style.maxWidth="100%";st.canvas.style.height="auto";
      $("#pv",dlg.root).innerHTML="";$("#pv",dlg.root).appendChild(st.canvas);
      $("[data-ok]",dlg.root).disabled=false;
    }catch(e){$("#pv",dlg.root).innerHTML=`<span class="note" style="color:var(--shu)">このページを描画できませんでした。</span>`;}
  };
  $("#pg",dlg.root).onchange=(e)=>{st.page=+e.target.value;draw();};
  $("#fin",dlg.root).onchange=draw;
  draw();
}
function step2(dlg,st){
  const img=st.img;
  const box=Math.min(620,Math.max(320,window.innerWidth-140));
  const sc=Math.min(box/img.width,420/img.height);
  const cw=Math.round(img.width*sc),ch=Math.round(img.height*sc);
  const ins=0.06;
  st.quad=[[img.width*ins,img.height*ins],[img.width*(1-ins),img.height*ins],
           [img.width*(1-ins),img.height*(1-ins)],[img.width*ins,img.height*(1-ins)]];
  $(".body",dlg.root).innerHTML=`
    <div class="note">図面枠の<b>四隅</b>に○を合わせてください。合わせた四角形が正対した図面になります。</div>
    <div style="display:grid;place-items:center"><canvas id="edit" width="${cw}" height="${ch}" style="touch-action:none;max-width:100%;border:1px solid var(--line);background:#fff"></canvas></div>
    <div class="row" style="margin:0">
      <button class="btn small" id="wtoggle" aria-pressed="true">台形補正する</button>
      <span class="spacer" style="flex:1"></span>
      <span class="lbl">仕上げ</span>
      <select class="select" id="fin"><option value="shadow" selected>白飛ばし（推奨）</option><option value="line">線画（2値）</option><option value="raw">そのまま</option></select>
      <button class="btn" id="prev">プレビュー</button>
    </div>
    <div id="pv" style="display:none;place-items:center;background:var(--sheet);border:1px solid var(--line);padding:8px"></div>`;
  $("[data-ok]",dlg.root).disabled=true;
  const cv=$("#edit",dlg.root),cx=cv.getContext("2d");
  const P=()=>st.quad.map(p=>[p[0]*sc,p[1]*sc]);
  const paint=()=>{
    cx.clearRect(0,0,cw,ch);cx.drawImage(img,0,0,cw,ch);
    if(!st.warp)return;
    const q=P();
    cx.beginPath();q.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.closePath();
    cx.fillStyle="rgba(35,75,133,.13)";cx.fill();
    cx.strokeStyle="#234B85";cx.lineWidth=2;cx.stroke();
    q.forEach(p=>{cx.beginPath();cx.arc(p[0],p[1],9,0,7);cx.fillStyle="#fff";cx.fill();
      cx.strokeStyle="#BC3B2B";cx.lineWidth=2.5;cx.stroke();});
  };
  let drag=-1;
  cv.onpointerdown=(e)=>{
    if(!st.warp)return;
    const b=cv.getBoundingClientRect(),k=cw/b.width;
    const x=(e.clientX-b.left)*k,y=(e.clientY-b.top)*k;
    const q=P();let best=-1,bd=26;
    q.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=i;}});
    if(best>=0){drag=best;cv.setPointerCapture(e.pointerId);}
  };
  cv.onpointermove=(e)=>{
    if(drag<0)return;
    const b=cv.getBoundingClientRect(),k=cw/b.width;
    st.quad[drag]=[Math.max(0,Math.min(img.width,(e.clientX-b.left)*k/sc)),
                   Math.max(0,Math.min(img.height,(e.clientY-b.top)*k/sc))];
    paint();
  };
  cv.onpointerup=()=>{drag=-1;};
  $("#wtoggle",dlg.root).onclick=(e)=>{st.warp=!st.warp;e.currentTarget.setAttribute("aria-pressed",st.warp);
    e.currentTarget.textContent=st.warp?"台形補正する":"補正しない";paint();};
  $("#prev",dlg.root).onclick=async()=>{
    const btn=$("#prev",dlg.root);btn.disabled=true;btn.textContent="処理中…";
    await new Promise(r=>setTimeout(r,20));
    let out;
    if(st.warp)out=warp(img,st.quad,2000);
    else{
      const k=Math.min(1,2000/Math.max(img.width,img.height));
      out=document.createElement("canvas");out.width=Math.round(img.width*k);out.height=Math.round(img.height*k);
      out.getContext("2d").drawImage(img,0,0,out.width,out.height);
    }
    st.canvas=finish(out,$("#fin",dlg.root).value);
    st.canvas.style.maxWidth="100%";st.canvas.style.height="auto";
    const pv=$("#pv",dlg.root);pv.style.display="grid";pv.innerHTML="";pv.appendChild(st.canvas);
    btn.disabled=false;btn.textContent="再プレビュー";
    $("[data-ok]",dlg.root).disabled=false;
  };
  paint();
}
async function register(dlg,st){
  if(!st.canvas){toast("プレビューを作成してください");return false;}
  const ok=$("[data-ok]",dlg.root);ok.disabled=true;ok.textContent="登録中…";
  try{
    const blob=await toBlob(st.canvas,$("#fin",dlg.root)?$("#fin",dlg.root).value:"shadow");
    const up=await S.assets.upload(blob);
    let pdfId=null;
    if(st.pdfBlob){try{pdfId=(await S.assets.upload(st.pdfBlob,{type:"application/pdf"})).id;}catch(e){}}
    const rev=nextRevLetter();
    const note=prompt("この版の変更内容（任意）","")||"";
    await S.db.collection(`${dwgPath()}/revs`).add({
      rev,src:"asset",asset:up.id,pdf:pdfId,w:st.canvas.width,h:st.canvas.height,
      note,by:S.me||"名無し",at:nowISO()});
    await S.db.doc(dwgPath()).update({lastRev:rev,status:"検図中"});
    toast(`Rev.${rev} を登録しました`);
  }catch(e){
    toast("登録できませんでした："+(e&&e.code?e.code:"エラー"));
    ok.disabled=false;ok.textContent="この内容で登録";return false;
  }
}
</script>
<script>
/* ---------------- プロジェクト・図面 ---------------- */
function newProject(){
  if(!need())return;

async function moveProject(p,vis){
  const from=rootOf(p),to=vis==="private"?"vault":"projects";
  if(from===to)return;
  const dws=await S.db.collection(`${from}/${p.id}/drawings`).get();
  for(const d of dws.docs){
    for(const sub of ["revs","marks"]){
      const snap=await S.db.collection(`${from}/${p.id}/drawings/${d.id}/${sub}`).get();
      for(const x of snap.docs){
        await S.db.doc(`${to}/${p.id}/drawings/${d.id}/${sub}/${x.id}`).set(x.data());
        await S.db.doc(`${from}/${p.id}/drawings/${d.id}/${sub}/${x.id}`).delete();
      }
    }
    await S.db.doc(`${to}/${p.id}/drawings/${d.id}`).set(d.data());
    await S.db.doc(`${from}/${p.id}/drawings/${d.id}`).delete();
  }
  const {_root,...body}=p;
  await S.db.doc(`${to}/${p.id}`).set({...body,visibility:vis});
  await S.db.doc(`${from}/${p.id}`).delete();
}

<script>
/* ---------------- 赤入れ（共同編集レイヤー） ---------------- */
const E={tool:"select",color:"shu",width:2,show:true,all:false,sel:null,shapes:[],mine:[]};
const COLORS={shu:"#BC3B2B",blue:"#234B85",green:"#2C6A4C",ink:"#1A2430"};
const ratioOf=()=>{const r=curRev();return r&&r.src==="asset"&&r.w&&r.h?r.h/r.w:841/1189;};
const VW=1000, VH=()=>1000*ratioOf();

const _selectDrawing=selectDrawing;
selectDrawing=function(did){
  if(subs.edit){subs.edit();delete subs.edit;}
  E.shapes=[];E.sel=null;E.mine=[];
  _selectDrawing(did);
  if(S.db&&did){
    subs.edit=S.db.collection(`${dwgPath()}/edits`).onSnapshot(snap=>{
      E.shapes=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
      renderStage();
    },()=>{});
  }
};
const _renderStage=renderStage;
renderStage=function(){_renderStage();mountEdits();syncEditBar();};

function cloudPath(x1,y1,x2,y2){
  const r=Math.max(6,Math.min(Math.abs(x2-x1),Math.abs(y2-y1))/9);
  const seg=(ax,ay,bx,by)=>{
    const len=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.round(len/(r*1.7)));
    let p="";
    for(let i=0;i<n;i++){
      const t0=i/n,t1=(i+1)/n;
      const sx=ax+(bx-ax)*t0,sy=ay+(by-ay)*t0,ex=ax+(bx-ax)*t1,ey=ay+(by-ay)*t1;
      p+=`A${r} ${r} 0 0 1 ${ex.toFixed(1)} ${ey.toFixed(1)}`;
      void sx;void sy;
    }
    return p;
  };
  const [X1,X2]=[Math.min(x1,x2),Math.max(x1,x2)],[Y1,Y2]=[Math.min(y1,y2),Math.max(y1,y2)];
  return `M${X1} ${Y1}`+seg(X1,Y1,X2,Y1)+seg(X2,Y1,X2,Y2)+seg(X2,Y2,X1,Y2)+seg(X1,Y2,X1,Y1);
}
function shapeSVG(s,sel){
  const c=COLORS[s.color]||COLORS.shu, w=(s.width||2)*1.6, ar=VH();
  const X=(p)=>(p[0]*VW).toFixed(1), Y=(p)=>(p[1]*ar).toFixed(1);
  const common=`fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
  const hit=`fill="none" stroke="rgba(0,0,0,0)" stroke-width="${w+14}" stroke-linecap="round"`;
  let body="",hitb="";
  if(s.type==="pen"||s.type==="line"||s.type==="arrow"){
    const pts=s.pts.map(p=>`${X(p)},${Y(p)}`).join(" ");
    body=`<polyline points="${pts}" ${common}/>`;hitb=`<polyline points="${pts}" ${hit}/>`;
    if(s.type==="arrow"&&s.pts.length>1){
      const a=s.pts[s.pts.length-2],b=s.pts[s.pts.length-1];
      const ang=Math.atan2(b[1]*ar-a[1]*ar,b[0]*VW-a[0]*VW),L=13+w*2;
      const p1=[b[0]*VW-L*Math.cos(ang-0.4),b[1]*ar-L*Math.sin(ang-0.4)];
      const p2=[b[0]*VW-L*Math.cos(ang+0.4),b[1]*ar-L*Math.sin(ang+0.4)];
      body+=`<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${X(b)} ${Y(b)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" ${common}/>`;
    }
  }else if(s.type==="rect"){
    const [a,b]=s.pts,x=Math.min(a[0],b[0])*VW,y=Math.min(a[1],b[1])*ar;
    const ww=Math.abs(b[0]-a[0])*VW,hh=Math.abs(b[1]-a[1])*ar;
    body=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${ww.toFixed(1)}" height="${hh.toFixed(1)}" ${common}/>`;
    hitb=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${ww.toFixed(1)}" height="${hh.toFixed(1)}" ${hit}/>`;
  }else if(s.type==="cloud"){
    const d=cloudPath(s.pts[0][0]*VW,s.pts[0][1]*ar,s.pts[1][0]*VW,s.pts[1][1]*ar);
    body=`<path d="${d}" ${common}/>`;hitb=`<path d="${d}" ${hit}/>`;
  }else if(s.type==="text"){
    const fs=13+(s.width||2)*4;
    body=`<text x="${X(s.pts[0])}" y="${Y(s.pts[0])}" fill="${c}" font-size="${fs}" font-family="Zen Kaku Gothic New, sans-serif">${esc(s.text||"")}</text>`;
    hitb=`<text x="${X(s.pts[0])}" y="${Y(s.pts[0])}" fill="rgba(0,0,0,0)" stroke="rgba(0,0,0,0)" stroke-width="12" font-size="${fs}" font-family="Zen Kaku Gothic New, sans-serif">${esc(s.text||"")}</text>`;
  }
  const box=sel?`<g opacity="0.9">${hitb.replace(/rgba\(0,0,0,0\)/g,COLORS.blue).replace(/stroke-width="[\d.]+"/,'stroke-width="1.5" stroke-dasharray="6 4"')}</g>`:"";
  return `<g data-eid="${esc(s.id)}" style="cursor:${E.tool==="select"?"move":"inherit"}">${box}${hitb}${body}</g>`;
}
function visibleShapes(){
  const r=curRev();
  return E.shapes.filter(s=>E.all||!r||s.rev===r.rev);
}
function mountEdits(){
  const sh=$("#sheet");if(!sh)return;
  const old=$(".editlayer",sh);if(old)old.remove();
  if(!E.show)return;
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("class","editlayer");
  svg.setAttribute("viewBox",`0 0 ${VW} ${VH()}`);
  svg.setAttribute("preserveAspectRatio","none");
  svg.style.cssText="position:absolute;inset:0;width:100%;height:100%;"+
    (E.tool==="select"?"pointer-events:none":"pointer-events:auto;cursor:crosshair;touch-action:none");
  svg.innerHTML=visibleShapes().map(s=>shapeSVG(s,s.id===E.sel)).join("");
  if(E.tool==="select"){
    $$("g[data-eid]",svg).forEach(g=>{g.style.pointerEvents="auto";});
  }
  const pin=$(".pinlayer",sh);
  sh.insertBefore(svg,pin||null);
  wireEdit(sh,svg);
}
function ptOf(e,sh){
  const b=sh.getBoundingClientRect();
  return [Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))];
}
function wireEdit(sh,svg){
  const ns="http://www.w3.org/2000/svg";
  if(E.tool==="select"){
    let drag=null;
    $$("g[data-eid]",svg).forEach(g=>{
      g.onpointerdown=(e)=>{
        e.stopPropagation();
        const id=g.dataset.eid,s=E.shapes.find(x=>x.id===id);
        if(!s)return;
        E.sel=id;renderStage();
        const g2=$(`g[data-eid="${id}"]`,$(".editlayer",$("#sheet")));
        if(!g2)return;
        const start=ptOf(e,sh),orig=s.pts.map(p=>[...p]);
        drag={s,start,orig,moved:false};
        g2.setPointerCapture(e.pointerId);
        g2.onpointermove=(ev)=>{
          if(!drag)return;
          const p=ptOf(ev,sh),dx=p[0]-drag.start[0],dy=p[1]-drag.start[1];
          if(Math.abs(dx)+Math.abs(dy)>0.002)drag.moved=true;
          drag.s.pts=drag.orig.map(q=>[q[0]+dx,q[1]+dy]);
          const layer=$(".editlayer",$("#sheet"));
          if(layer)layer.innerHTML=visibleShapes().map(x=>shapeSVG(x,x.id===E.sel)).join("");
        };
        g2.onpointerup=async()=>{
          const d=drag;drag=null;
          if(d&&d.moved&&S.db){try{await S.db.doc(`${dwgPath()}/edits/${d.s.id}`).update({pts:d.s.pts});}catch(err){}}
          renderStage();
        };
      };
      g.ondblclick=(e)=>{
        const s=E.shapes.find(x=>x.id===g.dataset.eid);
        if(!s||s.type!=="text")return;
        e.stopPropagation();
        const t=prompt("文字を修正",s.text||"");
        if(t!=null&&S.db)S.db.doc(`${dwgPath()}/edits/${s.id}`).update({text:t,editedBy:S.me||"名無し",editedAt:nowISO()});
      };
    });
    return;
  }
  let cur=null,el=null;
  svg.onpointerdown=(e)=>{
    if(!S.db){toast("接続していません");return;}
    if(!curRev())return;
    const p=ptOf(e,sh);
    if(E.tool==="text"){
      const t=prompt("記入する文字");
      if(t)addShape({type:"text",pts:[p],text:t});
      return;
    }
    cur={type:E.tool,pts:[p,p]};
    if(E.tool==="pen")cur.pts=[p];
    el=document.createElementNS(ns,"g");
    svg.appendChild(el);
    svg.setPointerCapture(e.pointerId);
  };
  svg.onpointermove=(e)=>{
    if(!cur)return;
    const p=ptOf(e,sh);
    if(E.tool==="pen"){
      const last=cur.pts[cur.pts.length-1];
      if(Math.hypot(p[0]-last[0],p[1]-last[1])>0.003)cur.pts.push(p);
    }else cur.pts[1]=p;
    el.innerHTML=shapeSVG({...cur,id:"_tmp",color:E.color,width:E.width});
  };
  svg.onpointerup=()=>{
    if(!cur)return;
    const s=cur;cur=null;if(el)el.remove();el=null;
    const a=s.pts[0],b=s.pts[s.pts.length-1];
    if(s.type!=="pen"&&Math.hypot(b[0]-a[0],b[1]-a[1])<0.008)return;
    if(s.type==="pen"&&s.pts.length<2)return;
    addShape(s);
  };
}
async function addShape(s){
  if(!need())return;
  const r=curRev();if(!r)return;
  const doc={...s,color:E.color,width:E.width,rev:r.rev,by:S.me||"名無し",at:nowISO()};
  try{
    const ref=await S.db.collection(`${dwgPath()}/edits`).add(doc);
    E.mine.push(ref.id);
  }catch(e){toast("書き込めませんでした");}
}
async function delShape(){
  if(!E.sel||!need())return;
  const id=E.sel;E.sel=null;
  try{await S.db.doc(`${dwgPath()}/edits/${id}`).delete();}catch(e){}
}
async function undoShape(){
  const id=E.mine.pop();
  if(!id||!need())return;
  try{await S.db.doc(`${dwgPath()}/edits/${id}`).delete();}catch(e){}
}
async function recolorSel(){
  if(!E.sel||!need())return;
  try{await S.db.doc(`${dwgPath()}/edits/${E.sel}`).update({color:E.color,width:E.width});}catch(e){}
}

document.addEventListener("keydown",(e)=>{

function step1(dlg,st){
  $(".body",dlg.root).innerHTML=`
    <div class="note">紙の図面は<b>真上から撮影</b>して台形補正するのが最短です。A3以下はスキャナ（300dpi・グレースケール）が最もきれいに残ります。</div>

      <label class="opt"><div><strong>3Dモデル（GLB / glTF）</strong><small>BIM・SketchUp・Blender からの書き出し。パースとして回して見られ、モデルの表面に指摘を打てます。約14MBまで。</small>
        <input type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" id="capGlb" style="margin-top:7px"></div></label>
    </div>
    <div class="note">どの形式でも、取り込んだ図面の上に全員で赤入れできます。原図は書き換わりません。</div>`;
  $("[data-ok]",dlg.root).disabled=true;
  const onImg=(e)=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const img=new Image();img.onload=()=>{st.img=img;st.pdfBlob=null;step2(dlg,st);};
    img.onerror=()=>toast("画像を読み込めませんでした");

  $("#capCam",dlg.root).onchange=onImg;
  $("#capFile",dlg.root).onchange=onImg;

      const text=await f.text();

      let w=1189,h=841;
      if(m){const v=m[1].trim().split(/\s+/).map(Number);if(v.length===4&&v[2]&&v[3]){w=v[2];h=v[3];}}
      const up=await S.assets.upload(f,{type:"image/svg+xml"});
      const rev=nextRevLetter();
      await S.db.collection(`${dwgPath()}/revs`).add({
        rev,src:"asset",asset:up.id,w:Math.round(w),h:Math.round(h),vector:true,
        note:$("#svgNote")?$("#svgNote").value:"",by:S.me||"名無し",at:nowISO()});
      await S.db.doc(dwgPath()).update({lastRev:rev,status:"検図中"});
      toast(`Rev.${rev}（ベクター）を登録しました`);
      dlg.close();
    }catch(err){
      $(".body",dlg.root).innerHTML=`<div class="note" style="color:var(--shu)">SVGを登録できませんでした。ファイルサイズ（2MBまで）と形式を確認してください。</div>`;
    }
  };
  $("#capPdf",dlg.root).onchange=async(e)=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    $(".body",dlg.root).innerHTML=`<div class="note">PDFを読み込んでいます…</div>`;
    try{
      const lib=await loadPdfJs();

      st.pdfBlob=f;
      st.pdfDoc=await lib.getDocument({data:buf,isEvalSupported:false}).promise;
      st.page=1;stepPdf(dlg,st);
    }catch(err){
      $(".body",dlg.root).innerHTML=`<div class="note" style="color:var(--shu)">PDFを読み込めませんでした。CADから画像（PNG/JPG）またはSVGで書き出して取り込んでください。</div>`;
    }
  };
}

<script>
/* ---------------- 3D / パース ---------------- */
const V={host:null,renderer:null,scene:null,camera:null,controls:null,model:null,
  loaded:null,pending:false,proj:"persp",restore:null,ro:null};
const THREE_BASE="https://cdn.jsdelivr.net/npm/three@0.128.0";

function abToB64(buf){
  const b=new Uint8Array(buf);let s="";
  for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(s);
}
function b64ToAb(b64){
  const bin=atob(b64),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return u.buffer;
}
function next3DLetter(){
  const used=S.revs.filter(r=>r.view==="3d").map(r=>r.rev);
  for(let i=0;i<26;i++){const l=REVLET(i);if(!used.includes(l))return l;}
  return String(used.length+1);
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));
    document.head.appendChild(s);
  });
}
async function loadThree(){
  if(window.THREE&&THREE.GLTFLoader&&THREE.OrbitControls)return;
  if(!window.THREE)await loadScript(THREE_BASE+"/build/three.min.js");
  if(!THREE.OrbitControls)await loadScript(THREE_BASE+"/examples/js/controls/OrbitControls.js");
  if(!THREE.GLTFLoader)await loadScript(THREE_BASE+"/examples/js/loaders/GLTFLoader.js");
}

/* サンプル：平面図と同じ 31.2m × 18m・3階建てのボリューム */
function genBuilding(){
  const g=new THREE.Group();
  const wall=new THREE.MeshLambertMaterial({color:0xE7E2D9});
  const glass=new THREE.MeshLambertMaterial({color:0x4A6C8C,transparent:true,opacity:.72});
  const trim=new THREE.MeshLambertMaterial({color:0xB2ADA3});
  const plinthM=new THREE.MeshLambertMaterial({color:0xD2D1C9});
  const W=31.2,D=18,FH=3.8,N=3;
  const body=new THREE.Mesh(new THREE.BoxGeometry(W,FH*N,D),wall);body.position.y=FH*N/2;g.add(body);
  const par=new THREE.Mesh(new THREE.BoxGeometry(W+.7,.9,D+.7),trim);par.position.y=FH*N+.35;g.add(par);
  for(let f=0;f<N;f++)for(let i=0;i<6;i++){
    const w=new THREE.Mesh(new THREE.BoxGeometry(3.4,2.0,.14),glass);
    w.position.set(-W/2+3.1+i*5.0,f*FH+2.0,D/2+.03);g.add(w);
    const w2=w.clone();w2.position.z=-D/2-.03;g.add(w2);
  }
  for(let f=0;f<N;f++)for(let i=0;i<3;i++){
    const w=new THREE.Mesh(new THREE.BoxGeometry(.14,2.0,3.0),glass);
    w.position.set(W/2+.03,f*FH+2.0,-D/2+3.4+i*5.2);g.add(w);
    const w2=w.clone();w2.position.x=-W/2-.03;g.add(w2);
  }
  const can=new THREE.Mesh(new THREE.BoxGeometry(9,.35,4.4),trim);can.position.set(0,3.55,D/2+2.2);g.add(can);
  [-4,4].forEach(x=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,3.55,14),trim);
    c.position.set(x,1.78,D/2+4.0);g.add(c);});
  const ent=new THREE.Mesh(new THREE.BoxGeometry(5.4,3.0,.14),glass);ent.position.set(0,1.5,D/2+.04);g.add(ent);
  const pl=new THREE.Mesh(new THREE.BoxGeometry(W+9,.4,D+10),plinthM);pl.position.y=-.2;g.add(pl);
  return g;
}

function ensureHost(){
  if(V.host)return V.host;
  const h=document.createElement("div");
  h.className="stage3d";
  h.innerHTML=`<div class="pinlayer" id="pin3d"></div><div class="hud" id="hud3d"></div>`;
  V.host=h;return h;
}
function initThree(){
  if(V.renderer)return;
  const h=V.host;
  V.renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  V.renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  V.renderer.setClearColor(0xF3F5F8,1);
  h.insertBefore(V.renderer.domElement,h.firstChild);
  V.scene=new THREE.Scene();
  V.scene.add(new THREE.HemisphereLight(0xFFFFFF,0xB6BCC4,0.95));
  const sun=new THREE.DirectionalLight(0xFFF6E8,0.75);sun.position.set(38,52,26);V.scene.add(sun);
  const fill=new THREE.DirectionalLight(0xDCE6F2,0.28);fill.position.set(-30,18,-24);V.scene.add(fill);
  const grid=new THREE.GridHelper(140,70,0x9AA6B4,0xC7CEd6);grid.position.y=-0.42;V.scene.add(grid);
  makeCamera("persp");
  V.ro=new ResizeObserver(()=>resize3D());
  V.ro.observe(h);
  V.renderer.domElement.addEventListener("pointerdown",onPick3D);
}
function makeCamera(kind){
  const h=V.host,w=Math.max(1,h.clientWidth),ht=Math.max(1,h.clientHeight),a=w/ht;
  const prev=V.camera;
  if(kind==="iso"){
    const d=prev?prev.position.length():70;
    const s=d*0.42;
    V.camera=new THREE.OrthographicCamera(-s*a,s*a,s,-s,.1,4000);
  }else{
    V.camera=new THREE.PerspectiveCamera(46,a,.1,4000);
  }
  const tgt=V.controls?V.controls.target.clone():new THREE.Vector3(0,5,0);
  V.camera.position.copy(prev?prev.position:new THREE.Vector3(44,26,52));
  if(V.controls)V.controls.dispose();
  V.controls=new THREE.OrbitControls(V.camera,V.renderer.domElement);
  V.controls.enableDamping=false;
  V.controls.target.copy(tgt);
  V.controls.addEventListener("change",requestRender);
  V.camera.lookAt(tgt);V.controls.update();
  V.proj=kind;
  resize3D();
}
function resize3D(){
  if(!V.renderer||!V.host)return;
  const w=Math.max(1,V.host.clientWidth),h=Math.max(1,V.host.clientHeight);
  V.renderer.setSize(w,h,false);
  if(V.camera.isOrthographicCamera){
    const a=w/h,s=(V.camera.top||20);
    V.camera.left=-s*a;V.camera.right=s*a;
  }else V.camera.aspect=w/h;
  V.camera.updateProjectionMatrix();
  requestRender();
}
function requestRender(){
  if(V.pending||!V.renderer)return;
  V.pending=true;
  requestAnimationFrame(()=>{
    V.pending=false;
    V.renderer.render(V.scene,V.camera);
    updatePins3D();updateHud();
  });
}
function updateHud(){
  const el=$("#hud3d",V.host);if(!el)return;
  const p=V.camera.position;
  el.textContent=`${V.proj==="iso"?"アイソメ":"パース"}  X ${p.x.toFixed(1)}  Y ${p.y.toFixed(1)}  Z ${p.z.toFixed(1)}  ／ ドラッグ=回転・ホイール=ズーム・右ドラッグ=平行移動`;
}
function fitCamera(dir){
  if(!V.model)return;
  const box=new THREE.Box3().setFromObject(V.model);
  const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
  const r=Math.max(sz.x,sz.y,sz.z)*0.62;
  const d=dir||new THREE.Vector3(1,0.62,1.15).normalize();
  const dist=r/Math.sin((V.camera.fov?V.camera.fov:46)*Math.PI/360)*1.22;
  V.camera.position.copy(c.clone().add(d.clone().multiplyScalar(dist)));
  V.controls.target.copy(c);
  if(V.camera.isOrthographicCamera){
    const a=V.host.clientWidth/Math.max(1,V.host.clientHeight),s=r*1.5;
    V.camera.top=s;V.camera.bottom=-s;V.camera.left=-s*a;V.camera.right=s*a;
  }
  V.camera.updateProjectionMatrix();V.controls.update();requestRender();
}
async function load3D(rev){
  if(V.loaded===rev.id)return;
  V.loaded=rev.id;
  if(V.model){V.scene.remove(V.model);V.model=null;}
  const busy=document.createElement("div");
  busy.className="loading3d";busy.textContent="モデルを読み込んでいます…";
  V.host.appendChild(busy);
  try{
    if(rev.src==="gen3d"){
      V.model=genBuilding();
    }else{
      const res=await fetch("/_blob/"+rev.asset);
      const j=await res.json();
      const buf=b64ToAb(j.b64);
      const loader=new THREE.GLTFLoader();
      const gltf=await new Promise((ok,ng)=>loader.parse(buf,"",ok,ng));
      V.model=gltf.scene||gltf.scenes[0];
    }
    V.scene.add(V.model);
    fitCamera();
  }catch(e){
    busy.textContent="このモデルを表示できませんでした。Draco圧縮を外し、GLB形式で書き出し直してください。";
    busy.style.color="var(--shu)";
    setTimeout(()=>busy.remove(),5200);
    requestRender();return;
  }
  busy.remove();
  if(V.restore){applyCam(V.restore);V.restore=null;}
  requestRender();
}
function camState(){
  return {p:V.camera.position.toArray().map(n=>+n.toFixed(3)),
          t:V.controls.target.toArray().map(n=>+n.toFixed(3)),iso:V.proj==="iso"};
}
function applyCam(c){
  if(!c||!c.p)return;
  if(c.iso&&V.proj!=="iso")makeCamera("iso");
  if(!c.iso&&V.proj!=="persp")makeCamera("persp");
  V.camera.position.fromArray(c.p);V.controls.target.fromArray(c.t||[0,5,0]);
  V.controls.update();requestRender();
}
function marks3D(){return S.marks.filter(m=>m.view==="3d");}
function updatePins3D(){
  const host=$("#pin3d",V.host);if(!host)return;
  const list=marks3D();
  const sig=list.map(m=>m.id+m.status).join("|")+"::"+S.selMark;
  if(host.dataset.sig!==sig){
    host.dataset.sig=sig;
    host.innerHTML=list.map(m=>`<button class="pin pin3d ${m.status==="done"?"done":""}" data-mid="${esc(m.id)}"
      aria-current="${m.id===S.selMark}" title="${esc(m.title)}"><span>${m.no}</span></button>`).join("");
    $$(".pin3d",host).forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const m=S.marks.find(x=>x.id===b.dataset.mid);
      S.selMark=b.dataset.mid;
      if(m&&m.cam)applyCam(m.cam);
      renderThreads();updatePins3D();
    });
  }
  const v=new THREE.Vector3();
  list.forEach((m,i)=>{
    const el=host.children[i];if(!el||!m.p)return;
    v.fromArray(m.p).project(V.camera);
    const vis=v.z<1&&v.x>=-1.2&&v.x<=1.2&&v.y>=-1.2&&v.y<=1.2;
    el.hidden=!vis;
    el.style.left=((v.x+1)/2*100).toFixed(2)+"%";
    el.style.top=((-v.y+1)/2*100).toFixed(2)+"%";
  });
}
function onPick3D(e){
  if(!S.pinMode||e.button!==0)return;
  const r=V.host.getBoundingClientRect();
  const nd=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  const ray=new THREE.Raycaster();ray.setFromCamera(nd,V.camera);
  const hit=V.model?ray.intersectObject(V.model,true)[0]:null;
  if(!hit){toast("モデルの表面をクリックしてください");return;}
  newMark3D(hit.point.toArray().map(n=>+n.toFixed(3)));
}
function newMark3D(p){
  if(!need())return;
  const r=curRev();if(!r)return;
  const cam=camState();
  dialog({title:"3Dモデル上に指摘を追加",ok:"起票",body:`
    <div class="row" style="margin:0;gap:10px">
      <div class="field" style="width:130px"><span>分類</span>
        <select id="mk">${KINDS.map(k=>`<option>${k}</option>`).join("")}</select></div>
      <div class="field" style="flex:1"><span>件名</span><input id="mt" placeholder="例：庇の出が短く雨掛かりが大きい"></div>
    </div>
    <div class="field"><span>内容</span><textarea id="mb" placeholder="根拠・依頼事項・確認したい点"></textarea></div>
    <div class="note mono">位置 X:${p[0]} Y:${p[1]} Z:${p[2]}　Rev.${esc(r.rev)}（3D）</div>
    <div class="note">いま見ているアングルも一緒に保存されます。指摘を開くと、この視点に戻ります。</div>`,
    onOk:async(root)=>{
      const title=$("#mt",root).value.trim();
      if(!title){toast("件名を入力してください");return false;}
      const no=(S.marks.reduce((m,v)=>Math.max(m,v.no||0),0))+1;
      await S.db.collection(`${dwgPath()}/marks`).add({
        no,view:"3d",p,cam,x:0,y:0,rev:r.rev,kind:$("#mk",root).value,title,
        body:$("#mb",root).value.trim(),status:"open",replies:[],by:S.me||"名無し",at:nowISO()});
      await bumpOpen(1);
      S.pinMode=false;$("#btnPin").setAttribute("aria-pressed","false");
      renderStage();
      toast(`指摘 #${no} を起票しました`);
    }});
}
async function savePerspective(){
  if(!need()||!S.assets){toast("パースの保存には編集権限が必要です");return;}
  V.renderer.render(V.scene,V.camera);
  const blob=await new Promise(r=>V.renderer.domElement.toBlob(r,"image/jpeg",0.92));
  if(!blob)return;
  toast("パースを書き出しています…");
  try{
    const up=await S.assets.upload(blob);
    const rev=nextRevLetter();
    await S.db.collection(`${dwgPath()}/revs`).add({
      rev,view:"2d",src:"asset",asset:up.id,w:V.renderer.domElement.width,h:V.renderer.domElement.height,
      note:"3Dビューから書き出したパース",by:S.me||"名無し",at:nowISO()});
    await S.db.doc(dwgPath()).update({lastRev:rev});
    S.view="2d";S.revId=null;renderStage();
    toast(`パースを Rev.${rev} として保存しました。赤入れできます。`);
  }catch(e){toast("保存できませんでした");}
}

/* 2D / 3D の切り替えとツールバー */
(function build3DBar(){
  const vt=document.createElement("div");
  vt.className="seg";vt.id="viewToggle";vt.setAttribute("role","group");vt.setAttribute("aria-label","表示の切り替え");
  vt.innerHTML=`<button data-v="2d" aria-pressed="true">図面</button><button data-v="3d" aria-pressed="false">3D パース</button>`;
  $("#toolbar").prepend(vt);
  $$("[data-v]",vt).forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(v==="3d"&&!has3D()){toast("この図面にはまだ3Dモデルがありません。「＋ 版を追加」からGLB/glTFを登録できます。");return;}
    S.view=v;S.revId=null;S.selMark=null;renderStage();renderThreads();
  });
  const bar=document.createElement("div");
  bar.className="toolbar";bar.id="bar3d";bar.hidden=true;
  bar.innerHTML=`
    <span class="lbl" style="margin-right:2px">視点</span>
    <div class="seg" role="group" aria-label="投影">
      <button data-proj="persp" aria-pressed="true">パース</button><button data-proj="iso" aria-pressed="false">アイソメ</button>
    </div>
    <div class="seg" role="group" aria-label="方位">
      <button data-dir="s">南</button><button data-dir="e">東</button><button data-dir="n">北</button><button data-dir="w">西</button><button data-dir="top">上</button>
    </div>
    <button class="btn" id="v3dFit">全体を表示</button>
    <span class="spacer" style="flex:1"></span>
    <button class="btn" id="v3dShot">このアングルをパースとして保存</button>`;
  $("#revbar").before(bar);
  $$("[data-proj]",bar).forEach(b=>b.onclick=()=>{
    if(!V.renderer)return;
    makeCamera(b.dataset.proj);fitCamera();
    $$("[data-proj]",bar).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  });
  const DIRS={s:[0,.28,1],n:[0,.28,-1],e:[1,.28,0],w:[-1,.28,0],top:[0.001,1,0.001]};
  $$("[data-dir]",bar).forEach(b=>b.onclick=()=>{
    if(!V.model)return;
    fitCamera(new THREE.Vector3(...DIRS[b.dataset.dir]).normalize());
  });
  $("#v3dFit",bar).onclick=()=>fitCamera();
  $("#v3dShot",bar).onclick=savePerspective;
})();

function sync3DBars(){
  const is3=S.view==="3d";
  $$("#viewToggle [data-v]").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.v==="3d")===is3)));
  const t3=$("#viewToggle [data-v='3d']");
  if(t3){t3.disabled=!has3D()&&!is3;t3.title=has3D()?"3Dモデルで見る":"3Dモデル未登録";}
  $("#bar3d").hidden=!is3;
  $("#editbar").hidden=is3;
  const cmpSeg=$("[data-cmp]")?$("[data-cmp]").parentElement:null;
  if(cmpSeg)cmpSeg.hidden=is3;
  $("#cmpCtl").hidden=is3||!(S.mode==="overlay"||S.mode==="wipe");
  const zoomSeg=$("#zIn")?$("#zIn").parentElement:null;
  if(zoomSeg)zoomSeg.hidden=is3;
  $("#btnInvert").hidden=is3;
}

/* 2Dのピンは2Dの指摘のみ */
function pinsHTML(){
  const r=curRev();
  return S.marks.filter(m=>(m.view||"2d")==="2d").filter(m=>!S.filt.curRev||!r||m.rev===r.rev).map(m=>
    `<button class="pin ${m.status==="done"?"done":""}" data-mid="${esc(m.id)}" aria-current="${m.id===S.selMark}"
      style="left:${(m.x*100).toFixed(2)}%;top:${(m.y*100).toFixed(2)}%" title="${esc(m.title)}"><span>${m.no}</span></button>`
  ).join("");
}

const _renderStage2=renderStage;
renderStage=function(){
  if(S.view!=="3d"){_renderStage2();sync3DBars();return;}
  renderTitleBlock();renderRevbar();sync3DBars();
  const w=$("#sheetWrap"),r=curRev();
  $("#btnRev").disabled=!S.did;$("#btnApprove").disabled=!S.did;$("#btnPin").disabled=!r;
  if(!r){
    w.innerHTML=`<div class="empty"><b>3Dモデルが登録されていません</b>「＋ 版を追加」からGLB / glTFを取り込むと、ここでパースとして回して見られます。</div>`;
    return;
  }
  const host=ensureHost();
  if(host.parentElement!==w){w.innerHTML="";w.style.padding="0";w.style.placeItems="stretch";w.appendChild(host);}
  host.classList.toggle("picking",!!S.pinMode);
  (async()=>{
    try{
      await loadThree();
      initThree();
      resize3D();
      await load3D(r);
      updatePins3D();
    }catch(e){
      w.innerHTML=`<div class="empty"><b>3D表示を読み込めませんでした</b>ネットワークを確認して開き直してください。図面表示には戻れます。</div>`;
    }
  })();
};
const _rt=renderThreads;
renderThreads=function(){
  _rt();
  $$(".thread",$("#threads")).forEach(b=>{
    const m=S.marks.find(x=>x.id===b.dataset.mid);if(!m)return;
    if(m.view==="3d"){
      const top=$(".th-top",b);
      if(top&&!$(".is3d",top)){
        const c=document.createElement("span");c.className="chip is3d";c.textContent="3D";
        top.insertBefore(c,top.children[1]||null);
      }
    }
    b.onclick=()=>{
      S.selMark=m.id;
      const v=m.view||"2d";
      if(v!==S.view&&(v!=="3d"||has3D())){S.view=v;S.revId=null;}
      if(v==="3d"&&m.cam)V.restore=m.cam;
      else if(v==="3d"&&m.cam===undefined&&V.renderer)V.restore=null;
      if(v==="3d"&&V.renderer&&V.loaded)applyCam(m.cam);
      renderThreads();renderStage();
    };
  });
};
/* 2Dに戻したら sheet-wrap の余白を戻す */
const _rs3=renderStage;
renderStage=function(){
  if(S.view!=="3d"){const w=$("#sheetWrap");if(w){w.style.padding="";w.style.placeItems="";}}
  _rs3();
};
renderAll();
</script>
